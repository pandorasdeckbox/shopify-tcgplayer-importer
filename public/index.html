<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="shopify-api-key" content="%SHOPIFY_API_KEY%">
    <title>TCGplayer Importer</title>
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <main>
      <h1>TCGplayer Importer</h1>
      <p>Open any product in Shopify Admin and choose <strong>Import from TCGplayer</strong> from its More actions menu.</p>
      <p>The importer reviews TCGplayer details and creates a separate Draft product. It never changes the product page you opened it from.</p>
    </main>
  </body>
</html>
