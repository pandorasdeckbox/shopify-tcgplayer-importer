# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "80d888f0f6bd77ae261413f3799b1dfa"
name = "TCGplayer Product Importer"
application_url = "https://tcgpimporter.pandorasdeckbox.com/app"
embedded = true
handle = "tcgplayer-importer"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_locations,read_inventory,write_inventory,read_publications,write_publications"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://tcgpimporter.pandorasdeckbox.com/auth/callback" ]
